#EmeraldSwap Configuration
[trades]
	#Item que reemplaza a la esmeralda (minecraft:emerald) en el INPUT de los trades.
	#Usa el formato: 'namespace:item_id'  (ej: 'minecraft:gold_nugget')
	#Default: minecraft:gold_ingot
	replacement_item = "uncrafted_coin:coin"
	#Si true, reemplaza también el segundo ingrediente del trade cuando también sea esmeralda.
	#Default: true
	replace_second_cost = true
